name: Lint with Ruff

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    name: Lint Python code with Ruff
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          ruff check . --output-format=github --select=E9,F63,F7,F82 --exit-non-zero-on-fix
          
      - name: Run Ruff with all rules
        run: |
          # Check for linting issues (non-blocking for now)
          ruff check . --output-format=github || true

      - name: Run Ruff formatter check
        run: |
          # Check if code is formatted (non-blocking)
          ruff format --check . || true

      - name: Display Ruff statistics
        if: always()
        run: |
          echo "Ruff version:"
          ruff --version
          echo ""
          echo "Linting statistics:"
          ruff check . --statistics || true
