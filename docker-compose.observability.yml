# Jaeger Docker Compose Configuration
# Start with: docker-compose -f docker-compose.observability.yml up -d

version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: comfyui-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "6831:6831/udp"  # Jaeger agent
      - "6832:6832/udp"  # Agent - compact thrift protocol
      - "5778:5778"      # Serve frontend
      - "16686:16686"    # Query UI
      - "14268:14268"    # Collector HTTP
      - "14250:14250"    # gRPC
      - "9411:9411"      # Zipkin compatible endpoint
    networks:
      - comfyui

  prometheus:
    image: prom/prometheus:latest
    container_name: comfyui-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - comfyui
    depends_on:
      - jaeger

  grafana:
    image: grafana/grafana:latest
    container_name: comfyui-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - comfyui
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  comfyui:
    driver: bridge
